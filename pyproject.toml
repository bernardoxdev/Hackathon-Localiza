[project]
name = "hackathon-localiza"
version = "0.1.0"
description = "Novas funcionalidades para o Localiza Assinatura"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "google-play-scraper>=1.2.7",
    "gunicorn>=26.2.0",
    "openai>=2.0.0",
    "pandas>=3.0.6",
    "uvicorn>=0.54.0",
    "uvicorn-worker>=0.4.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

ignore = [
    "E501",
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]

[project.scripts]
localiza = "app.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pre-commit<4",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
